[project]
name = "video-quality-filter"
version = "0.2.0"
description = "Extract video-dataset metadata and apply a separate filtering policy before multimodal training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "Pillow>=10.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
vlm = [
    "torch>=2.2",
    "transformers>=4.49",
    "accelerate>=0.34",
    "qwen-vl-utils>=0.0.8",
]
internvideo = [
    "torch>=2.2",
    "transformers>=4.49",
    "torchvision>=0.17",
    "einops>=0.7",
    "timm>=0.9",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
]
storage = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
video-quality-filter = "video_quality_filter.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
