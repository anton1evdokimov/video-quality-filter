# Тяжёлые модели. Перед запуском:
#   pip install -e ".[vlm,internvideo]"
# Судья LLaVA-OneVision-2 требует transformers>=5.7.
# Отчёты уходят в MinIO, если storage.enabled. Ролики — команда upload, прогон их читает с --from-storage.

visual:
  backend: qwen_vl

vlm:
  backend: qwen_vl
  judge_model_id: lmms-lab-encoder/LLaVA-OneVision-2-8B-Instruct

video_text:
  backend: internvideo2

dedup:
  embedding: internvideo2

filtering:
  min_semantic_consistency: 0.4
  min_temporal_coverage: 0.4
  min_completeness: 0.4
  max_hallucination: 0.5
  min_video_text_cosine: 0.2
  require_vlm: true
  require_video_text: true
